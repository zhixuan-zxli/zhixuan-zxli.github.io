<text x="52.0" y="210.0" font-size="12.0" font-weight="700" fill="#0f172a">hidden / shared_hidden</text>
<text x="52.0" y="225.6" font-size="10.0" font-weight="400" fill="#475569">bf16 或 (fp8, sf)</text>
<text x="52.0" y="238.6" font-size="10.0" font-weight="400" fill="#475569">YOCO 可选</text>
<text x="52.0" y="251.6" font-size="9.0" font-weight="400" fill="#64748b">in [T|B, H]</text>
<rect x="280.0" y="190.0" width="270.0" height="90.0" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="292.0" y="210.0" font-size="12.0" font-weight="700" fill="#1e3a8a">GEMM · current_hidden_proj</text>
<text x="292.0" y="225.6" font-size="10.0" font-weight="400" fill="#475569">[Gate ∥ A ∥ weights]</text>
<text x="292.0" y="238.6" font-size="10.0" font-weight="400" fill="#475569">一次 bf16 GEMM</text>
<text x="292.0" y="251.6" font-size="9.0" font-weight="400" fill="#64748b">in [T|B,H] → projected [T|B,2·512] fp32</text>
<rect x="590.0" y="180.0" width="340.0" height="110.0" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="2.0"/>
<text x="602.0" y="200.0" font-size="12.0" font-weight="700" fill="#7c2d12">FUSED · C2 压缩</text>
<text x="602.0" y="215.6" font-size="10.0" font-weight="400" fill="#475569">compress_and_update_state_{prefill,decode}</text>
<text x="602.0" y="228.6" font-size="10.0" font-weight="400" fill="#475569">state + softmax + 加权和</text>
<text x="602.0" y="241.6" font-size="9.0" font-weight="400" fill="#64748b">in [T|B,2·512] → kv_compressed [T/N|B,512] bf16</text>
<rect x="970.0" y="190.0" width="230.0" height="90.0" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="982.0" y="210.0" font-size="12.0" font-weight="700" fill="#0f172a">CACHE · state_cache</text>
<text x="982.0" y="225.6" font-size="10.0" font-weight="400" fill="#475569">[slots, S, 2, 512] fp32</text>
<rect x="590.0" y="450.0" width="360.0" height="100.0" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="2.0"/>
<text x="602.0" y="470.0" font-size="12.0" font-weight="700" fill="#7c2d12">FUSED · 主 KV 写</text>
<text x="602.0" y="485.6" font-size="10.0" font-weight="400" fill="#475569">fused_norm_rope_hadamard_cast_store_kvcache</text>
<text x="602.0" y="498.6" font-size="10.0" font-weight="400" fill="#475569">RMSNorm + RoPE + cast + store</text>
<text x="602.0" y="511.6" font-size="9.0" font-weight="400" fill="#64748b">in [T/N|B,512] → ca + pre_rope [T/N|B,512]</text>
<rect x="1002.0" y="460.0" width="220.0" height="80.0" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="1014.0" y="480.0" font-size="12.0" font-weight="700" fill="#0f172a">CACHE · ca_cache</text>
<text x="1014.0" y="495.6" font-size="10.0" font-weight="400" fill="#475569">FP4 288B / MXFP8 528B</text>
<text x="1014.0" y="508.6" font-size="10.0" font-weight="400" fill="#475569">→ SWA+CA sparse MLA</text>
<text x="1014.0" y="521.6" font-size="9.0" font-weight="400" fill="#64748b">[blocks, C, 512]</text>
<rect x="990.0" y="560.0" width="220.0" height="80.0" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="1002.0" y="580.0" font-size="12.0" font-weight="700" fill="#064e3b">pre_rope_kv [T/N|B,512]</text>
<text x="1002.0" y="595.6" font-size="10.0" font-weight="400" fill="#475569">out_stage=norm · bf16</text>
<rect x="1290.0" y="560.0" width="250.0" height="80.0" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="1302.0" y="580.0" font-size="12.0" font-weight="700" fill="#0f172a">→ Indexer KProject</text>
<text x="1302.0" y="595.6" font-size="10.0" font-weight="400" fill="#475569">复用 pre_rope_kv</text>
<text x="1302.0" y="608.6" font-size="9.0" font-weight="400" fill="#64748b">[T/N|B, 512] bf16</text>
<rect x="40.0" y="750.0" width="480.0" height="100.0" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="52.0" y="770.0" font-size="10.5" font-weight="700" fill="#334155">C1 / ratio=1</text>
<text x="52.0" y="783.6" font-size="10.0" font-weight="400" fill="#475569">无 Gate / state_cache，跳过两个 compress kernel；</text>
<text x="52.0" y="796.6" font-size="10.0" font-weight="400" fill="#475569">仍走 STAGE 2 的 norm+rope+cast+store。</text>
<rect x="540.0" y="750.0" width="480.0" height="100.0" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="552.0" y="770.0" font-size="10.5" font-weight="700" fill="#334155">CP 重叠</text>
<text x="552.0" y="783.6" font-size="10.0" font-weight="400" fill="#475569">projected_kv all_gather 先 launch，与 Q 投影重叠；</text>
<text x="552.0" y="796.6" font-size="10.0" font-weight="400" fill="#475569">prefill 压缩前按 mirror index gather 重排。</text>
<rect x="1040.0" y="750.0" width="500.0" height="100.0" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="1052.0" y="770.0" font-size="10.5" font-weight="700" fill="#334155">跨层共享</text>
<text x="1052.0" y="783.6" font-size="10.0" font-weight="400" fill="#475569">kv source 写一次 ca_cache / pre_rope_kv；</text>
<text x="1052.0" y="796.6" font-size="10.0" font-weight="400" fill="#475569">consumer 通过 SharedLayerTopology 复用。</text>
