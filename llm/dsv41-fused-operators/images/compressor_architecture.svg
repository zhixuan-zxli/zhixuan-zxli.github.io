<text x="40.0" y="47.8" font-size="26.0" font-weight="700" fill="#0f172a">Compressor · 压缩 KV</text>
<text x="40.0" y="103.0" font-size="9.0" font-weight="400" fill="#94a3b8">shape：T=prefill token · B=decode token · T|B=共用 · H=hidden · Rq=q_lora_rank · N_h/N_i=heads · N=compress ratio</text>
<text x="40.0" y="115.2" font-size="9.0" font-weight="400" fill="#94a3b8">W=window · W_s=SWA block size · K=topk · C=compressed cache len · L_c=compressed KV len · K_v=gathered KV len · K_b=candidate blocks · S=state ring size</text>
<text x="40.0" y="76.1" font-size="12.0" font-weight="400" fill="#475569">C2：state 更新 + 逐维 softmax + 加权和 → norm + RoPE + cast + store；pre-RoPE KV 作为副产物给 Indexer。</text>
